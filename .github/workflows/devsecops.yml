name: Pipeline Devsecops

on:
  push:
    branches:
      - feature/devsecops-pipeline

jobs:

  SCA:
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle Wrapper
        run: ./gradlew build -x test

      - name: Install OWASP Dependency Check
        run: |
          curl -L -o dependency-check.zip https://github.com/dependency-check/DependencyCheck/releases/download/v12.1.0/dependency-check-12.1.0-release.zip
          unzip dependency-check.zip

      - name: Run SCA with OWASP Dependency Check
        run: |
          ./dependency-check/bin/dependency-check.sh \
            --project "pet-clinic" \
            --scan "." \
            --format "HTML" \
            --out "reports" \
            --enableRetired \
            --disableOssIndex \
            --failOnCVSS 5

      - name: Upload Dependency Check Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports
