name: Pipeline

on:
  push:
    branches:
      - feature/devsecops-pipeline

jobs:
  devsecops:
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Clonación del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java

      - name: Dar permisos a Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Compilar proyecto con Gradle
        run: ./gradlew clean build -x test

      - name: Ejecutar análisis SAST con CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          output: codeql-results

      - name: Bloquear pipeline por hallazgos SAST CodeQL
        run: |
          echo "Buscando resultados SARIF de CodeQL..."
          SARIF_FILE=$(find codeql-results -name "*.sarif" | head -n 1)

          if [ -z "$SARIF_FILE" ]; then
            echo "No se encontró archivo SARIF de CodeQL"
            exit 1
          fi

          echo "Archivo SARIF encontrado: $SARIF_FILE"

          COUNT=$(jq '[.runs[].results[]?] | length' "$SARIF_FILE")

          echo "Cantidad de hallazgos SAST CodeQL encontrados: $COUNT"

          if [ "$COUNT" -gt 0 ]; then
            echo "El pipeline se detiene porque CodeQL encontró hallazgos SAST."
            exit 1
          else
            echo "No se detectaron hallazgos SAST."
          fi
