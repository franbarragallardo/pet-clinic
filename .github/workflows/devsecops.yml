name: Pipeline

on:
  push:
    branches:
      - feature/devsecops-pipeline

jobs:
  devsecops:
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Clonación del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java

      - name: Dar permisos a Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Compilar proyecto con Gradle
        run: ./gradlew clean build -x test

      - name: Ejecutar análisis SAST con CodeQL
        uses: github/codeql-action/analyze@v4
     
      - name: Validar vulnerabilidades SAST
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 20

          ALERTS=$(gh api \
            /repos/${{ github.repository }}/code-scanning/alerts \
            --jq '.[] | select(.rule.severity=="medium" or .rule.severity=="high" or .rule.severity=="critical")')

          if [ ! -z "$ALERTS" ]; then
            echo "Se detectaron vulnerabilidades Medium/High/Critical"
            exit 1
          fi
        
