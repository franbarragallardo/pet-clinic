name: Pipeline

on:
  push:
    branches:
      - feature/devsecops-pipeline

jobs:
  devsecops:
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Clonación del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java

      - name: Dar permisos a Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Compilar proyecto con Gradle
        run: ./gradlew clean build -x test

      - name: Ejecutar análisis SAST con CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          output: codeql-results

      - name: Bloquear pipeline por vulnerabilidades SAST Medium High Critical
        run: |
          echo "Buscando resultados SARIF de CodeQL..."
          SARIF_FILE=$(find codeql-results -name "*.sarif" | head -n 1)

          if [ -z "$SARIF_FILE" ]; then
            echo "No se encontró archivo SARIF de CodeQL"
            exit 1
          fi

          echo "Archivo SARIF encontrado: $SARIF_FILE"

          COUNT=$(jq '
            [
              .runs[] as $run
              | $run.results[]?
              | .ruleId as $ruleId
              | (
                  $run.tool.driver.rules[]
                  | select(.id == $ruleId)
                  | .properties."security-severity"? // "0"
                  | tonumber
                ) as $sev
              | select($sev >= 5.0)
            ]
            | length
          ' "$SARIF_FILE")

          echo "Cantidad de vulnerabilidades SAST Medium/High/Critical encontradas: $COUNT"

          if [ "$COUNT" -gt 0 ]; then
            echo "El pipeline se detiene por vulnerabilidades SAST Medium/High/Critical."
            exit 1
          fi

        
