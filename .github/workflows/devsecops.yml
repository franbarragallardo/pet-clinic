name: Pipeline

on:
  push:
    branches:
      - feature/devsecops-pipeline

jobs:
  devsecops:
    runs-on: ubuntu-latest

    steps:

      - name: Clonación del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Dar permisos a Maven Wrapper
        run: chmod +x ./mvnw

      - name: Compilar proyecto
        run: ./mvnw clean verify -DskipTests

      - name: SAST con SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw sonar:sonar \
            -Dsonar.projectKey=franbarraagallardo_pet-clinic \
            -Dsonar.organization=franbarraagallardo \
            -Dsonar.host.url=https://sonarcloud.io
