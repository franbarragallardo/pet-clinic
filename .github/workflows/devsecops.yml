name: Pipeline

on:
  push:
    branches:
      - feature/devsecops-pipeline

jobs:
  devsecops:
    runs-on: ubuntu-latest

    steps:
      - name: Clonación del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Dar permisos a Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Compilar proyecto con Gradle
        run: ./gradlew clean build -x test

      - name: Ejecutar SCA con OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'pet-clinic'
          path: '.'
          format: 'HTML'
          out: 'reports'
          args: >
            --enableRetired
            --failOnCVSS 5

      - name: Publicar reporte SCA
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports
